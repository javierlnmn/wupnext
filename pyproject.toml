[project]
name = "wupnext"
version = "0.1.0"
description = ""
authors = [
    {name = "javierlnmn",email = "jlm03123@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0.0"
dependencies = [
    "asgiref (==3.8.1)",
    "django (>=5.2,<5.3)",
    "django-jet-reboot (==1.3.10)",
    "django-browser-reload (==1.13.0)",
    "django-tailwind (==3.8.0)",
    "python-dotenv (==1.0.1)",
    "python-slugify (==8.0.4)",
    "six (==1.16.0)",
    "sqlparse (==0.5.1)",
    "text-unidecode (==1.3)",
    "tzdata (==2024.2)",
    "ruff (>=0.15.6,<0.16.0)",
    "gunicorn (>=23.0.0)",
    "whitenoise (>=6.12.0,<7.0.0)",
    "django-anymail[resend] (>=15.0,<16.0)",
    "django-q2 (>=1.10.0,<2.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false

[tool.ruff]
line-length = 88
target-version = "py311"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.isort]
combine-as-imports = true
force-single-line = false

[tool.ruff.format]
quote-style = "single"


[dependency-groups]
dev = [
    "factory-boy (>=3.3.3,<4.0.0)"
]
