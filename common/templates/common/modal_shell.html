<div
  x-show="{{ openStateKey }}"
  x-cloak
  @click="{{ openStateKey }} = false"
  x-transition.opacity
  class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm"
  style="z-index: {{ backdrop_z }}"
></div>

<div
  x-show="{{ openStateKey }}"
  x-cloak
  x-transition
  class="fixed inset-0 flex items-center justify-center p-4 pointer-events-none"
  style="z-index: {{ z }}"
>
  <div
    @click.stop
    class="w-full bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-2xl pointer-events-auto"
    style="max-width: {{ width }}"
  >
    {{ content }}
  </div>
</div>
