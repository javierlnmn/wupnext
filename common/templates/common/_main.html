{% load static tailwind_tags %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wupnext</title>
    <meta name="csrf-token" content="{{ csrf_token }}" />

    <script>
      const storedTheme = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (storedTheme === "dark" || (!storedTheme && prefersDark)) {
        document.documentElement.classList.add("dark");
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link
      rel="icon"
      type="image/svg+xml"
      href="{% static 'favicon/favicon.svg' %}"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="{% static 'favicon/favicon-96x96.png' %}"
    />
    <link rel="shortcut icon" href="{% static 'favicon/favicon.ico' %}" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="{% static 'favicon/apple-touch-icon.png' %}"
    />
    <link rel="manifest" href="{% static 'favicon/site.webmanifest' %}" />

    {% tailwind_css %}
    <style>
      body { font-family: 'Manrope', sans-serif; }
      [x-cloak] { display: none !important; }
    </style>
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <script
      src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"
      defer
    ></script>
  </head>
  <body
    class="flex flex-col min-h-svh bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors"
    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
  >
    <button
      type="button"
      onclick="const isDark = document.documentElement.classList.toggle('dark'); localStorage.setItem('theme', isDark ? 'dark' : 'light')"
      class="fixed top-4 right-4 z-50 w-10 h-10 rounded-full bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 shadow-md shadow-slate-900/5 dark:shadow-black/20 flex items-center justify-center text-slate-500 dark:text-slate-400 hover:text-clay-600 dark:hover:text-clay-400 transition-colors"
      aria-label="Toggle color theme"
    >
      <svg class="w-[18px] h-[18px] block dark:hidden" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.36 6.36l-.7-.7M6.34 6.34l-.7-.7m12.02 0l-.7.7M6.34 17.66l-.7.7M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
      </svg>
      <svg class="w-[18px] h-[18px] hidden dark:block" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
      </svg>
    </button>
    {% block content %} {% endblock %}
  </body>
</html>
