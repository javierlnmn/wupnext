{% load static tailwind_tags %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>wupnext</title>
    <meta name="csrf-token" content="{{ csrf_token }}" />

    <script>
      const storedTheme = localStorage.getItem("theme");
      const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
      if (storedTheme === "dark" || (!storedTheme && prefersDark)) {
        document.documentElement.classList.add("dark");
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link
      rel="icon"
      type="image/svg+xml"
      href="{% static 'favicon/favicon.svg' %}"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="96x96"
      href="{% static 'favicon/favicon-96x96.png' %}"
    />
    <link rel="shortcut icon" href="{% static 'favicon/favicon.ico' %}" />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="{% static 'favicon/apple-touch-icon.png' %}"
    />
    <link rel="manifest" href="{% static 'favicon/site.webmanifest' %}" />

    {% tailwind_css %}
    <style>
      body { font-family: 'Manrope', sans-serif; }
      [x-cloak] { display: none !important; }
      .no-spinner { -moz-appearance: textfield; appearance: textfield; }
      .no-spinner::-webkit-inner-spin-button,
      .no-spinner::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
    <script src="https://unpkg.com/htmx.org@2.0.4" defer></script>
    <script
      src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js"
      defer
    ></script>
  </head>
  <body
    class="flex flex-col min-h-svh bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 transition-colors"
    hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
  >
    {% block content %} {% endblock %}
  </body>
</html>
