<div
  x-show="{{ openStateKey }}"
  x-cloak
  @click="{{ openStateKey }} = false"
  x-transition.opacity
  class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40"
></div>

<div
  x-show="{{ openStateKey }}"
  x-cloak
  x-transition:enter="transition ease-out duration-300"
  x-transition:enter-start="translate-x-full"
  x-transition:enter-end="translate-x-0"
  x-transition:leave="transition ease-in duration-200"
  x-transition:leave-start="translate-x-0"
  x-transition:leave-end="translate-x-full"
  class="fixed top-0 right-0 h-full w-full bg-white dark:bg-slate-900 border-l border-slate-200 dark:border-slate-800 shadow-2xl z-50 flex flex-col"
  style="max-width: {{ width }}"
>
  {{ content }}
</div>
