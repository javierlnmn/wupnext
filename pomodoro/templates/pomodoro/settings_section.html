<section>
  <div class="flex items-center gap-2 mb-4">
    <div class="w-8 h-8 rounded-lg bg-clay-500/10 flex items-center justify-center shrink-0">
      {% include 'common/icons/clock.html' with class='w-4 h-4 text-clay-600 dark:text-clay-400' %}
    </div>
    <div>
      <h3 class="text-sm font-bold text-slate-900 dark:text-white">Pomodoro</h3>
      <p class="text-[12px] text-slate-500 dark:text-slate-400">Focus and break lengths, in minutes.</p>
    </div>
  </div>

  <div class="space-y-3">
    <label class="flex items-center justify-between gap-3 text-sm text-slate-600 dark:text-slate-300">
      <span>Focus</span>
      <span class="flex items-center gap-1.5">
        <input type="number" name="pomodoro_focus" min="1" max="180" value="{{ pomodoro_settings.focus }}" class="w-16 h-8 text-right bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2 text-sm tabular-nums outline-none focus:border-clay-500/50 no-spinner">
        <span class="text-xs text-slate-400">min</span>
      </span>
    </label>
    <label class="flex items-center justify-between gap-3 text-sm text-slate-600 dark:text-slate-300">
      <span>Short break</span>
      <span class="flex items-center gap-1.5">
        <input type="number" name="pomodoro_short_break" min="1" max="180" value="{{ pomodoro_settings.short }}" class="w-16 h-8 text-right bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2 text-sm tabular-nums outline-none focus:border-clay-500/50 no-spinner">
        <span class="text-xs text-slate-400">min</span>
      </span>
    </label>
    <label class="flex items-center justify-between gap-3 text-sm text-slate-600 dark:text-slate-300">
      <span>Long break</span>
      <span class="flex items-center gap-1.5">
        <input type="number" name="pomodoro_long_break" min="1" max="180" value="{{ pomodoro_settings.long }}" class="w-16 h-8 text-right bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2 text-sm tabular-nums outline-none focus:border-clay-500/50 no-spinner">
        <span class="text-xs text-slate-400">min</span>
      </span>
    </label>
    <label class="flex items-center justify-between gap-3 text-sm text-slate-600 dark:text-slate-300">
      <span>Long break every</span>
      <span class="flex items-center gap-1.5">
        <input type="number" name="pomodoro_long_every" min="1" max="12" value="{{ pomodoro_settings.every }}" class="w-16 h-8 text-right bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2 text-sm tabular-nums outline-none focus:border-clay-500/50 no-spinner">
        <span class="text-xs text-slate-400">🍅</span>
      </span>
    </label>
  </div>
</section>
