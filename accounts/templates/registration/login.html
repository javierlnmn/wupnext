{% extends 'common/_main.html' %} {% load static %} {% block content %}
<main class="flex-1 flex">
  <div
    class="w-full lg:w-3/5 flex flex-col items-center justify-center px-6 py-12"
  >
    <div class="w-full max-w-[380px]">
      <div class="text-center mb-10">
        <p class="text-2xl font-extrabold tracking-tight text-stone-900 dark:text-white mb-3">
          wup<span class="text-clay-500">next</span>
        </p>
        <p class="text-sm text-stone-500">Sign in to continue</p>
      </div>

      {% if form.errors %}
      <div
        class="mb-6 px-4 py-3 rounded-xl bg-rose-500/10 border border-rose-500/20 text-rose-500 dark:text-rose-400 text-sm text-center"
      >
        Invalid username or password.
      </div>
      {% endif %}

      <form method="POST" action="{% url 'accounts:login' %}" class="space-y-5">
        {% csrf_token %}
        <div>
          <label
            for="username"
            class="block text-[13px] text-stone-500 dark:text-stone-400 mb-1.5"
            >Username</label
          >
          <input
            required
            type="text"
            name="username"
            id="username"
            placeholder="Enter your username"
            class="w-full h-11 bg-white dark:bg-stone-900 border border-stone-200 dark:border-stone-800 rounded-xl px-4 text-[15px] text-stone-900 dark:text-white placeholder-stone-400 dark:placeholder-stone-600 outline-none focus:border-clay-500/50 focus:ring-1 focus:ring-clay-500/30 transition-all"
          />
        </div>
        <div>
          <label
            for="password"
            class="block text-[13px] text-stone-500 dark:text-stone-400 mb-1.5"
            >Password</label
          >
          <input
            required
            type="password"
            name="password"
            id="password"
            placeholder="Enter your password"
            class="w-full h-11 bg-white dark:bg-stone-900 border border-stone-200 dark:border-stone-800 rounded-xl px-4 text-[15px] text-stone-900 dark:text-white placeholder-stone-400 dark:placeholder-stone-600 outline-none focus:border-clay-500/50 focus:ring-1 focus:ring-clay-500/30 transition-all"
          />
        </div>
        <button
          type="submit"
          class="w-full h-11 bg-clay-500 hover:bg-clay-600 text-white font-semibold rounded-xl shadow-lg shadow-clay-600/20 transition-all"
        >
          Sign in
        </button>
      </form>
    </div>
  </div>

  <div class="hidden lg:block w-2/5 relative">
    <img
      src="{% static 'img/login-hero.png' %}"
      alt=""
      class="absolute inset-0 w-full h-full object-cover"
    />
  </div>
</main>
{% endblock %}
