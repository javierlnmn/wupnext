<section>
  <div class="flex items-center gap-2 mb-4">
    <div class="w-8 h-8 rounded-lg bg-clay-500/10 flex items-center justify-center shrink-0">
      {% include 'common/icons/bell.html' with class='w-4 h-4 text-clay-600 dark:text-clay-400' %}
    </div>
    <div>
      <h3 class="text-sm font-bold text-slate-900 dark:text-white">Notifications</h3>
      <p class="text-[12px] text-slate-500 dark:text-slate-400">Choose how WupNext reaches you.</p>
    </div>
  </div>

  <div class="space-y-3">
    <label class="flex items-center justify-between gap-3 text-sm text-slate-600 dark:text-slate-300 cursor-pointer">
      <span>
        Email reminders
        <span class="block text-[12px] text-slate-400">Daily digest of tasks that are due or overdue.</span>
      </span>
      <span class="relative inline-flex items-center shrink-0">
        <input
          type="checkbox"
          name="notification_channels_email_enabled"
          class="sr-only peer"
          {% if request.user.preferences.notification_channels_email_enabled %}checked{% endif %}
        >
        <span class="w-10 h-6 bg-slate-200 dark:bg-slate-700 rounded-full peer-checked:bg-clay-500 transition-colors"></span>
        <span class="absolute left-0.5 top-0.5 w-5 h-5 bg-white rounded-full shadow transition-transform peer-checked:translate-x-4"></span>
      </span>
    </label>
  </div>
</section>
