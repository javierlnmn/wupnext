<div
  x-data="{ prefsOpen: false }"
  @open-preferences.window="prefsOpen = true"
  @close-preferences="prefsOpen = false"
  @keydown.escape.window="prefsOpen = false"
>
  <div
    x-show="prefsOpen"
    x-cloak
    @click="prefsOpen = false"
    x-transition.opacity
    class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40"
  ></div>

  <div
    x-show="prefsOpen"
    x-cloak
    x-transition
    class="fixed inset-0 z-50 flex items-center justify-center p-4 pointer-events-none"
  >
    <div
      @click.stop
      class="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-2xl pointer-events-auto"
    >
      <div class="flex items-center justify-between px-6 py-5 border-b border-slate-200 dark:border-slate-800">
        <h2 class="text-lg font-bold text-slate-900 dark:text-white">Preferences</h2>
        <button
          type="button"
          @click="prefsOpen = false"
          class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors"
          aria-label="Close"
        >
          <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>

      <div class="px-6 py-6">
        {% include 'pomodoro/settings_section.html' %}
      </div>
    </div>
  </div>
</div>
