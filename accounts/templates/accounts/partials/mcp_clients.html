<p class="text-sm text-slate-600 dark:text-slate-300 mb-1.5">Connected clients</p>
{% if clients %}
  <ul class="space-y-2">
    {% for client in clients %}
      <li class="flex items-center justify-between gap-3 px-3 py-2 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-lg">
        <span class="min-w-0">
          <span class="block truncate text-[13px] text-slate-600 dark:text-slate-300">
            {{ client.name|default:client.client_id }}
          </span>
          <span class="block text-[12px] text-slate-400">
            Connected {{ client.connected_at|date:'j M Y' }}
          </span>
        </span>
        <button
          type="button"
          @click="promptRevoke('{{ client.name|default:client.client_id|escapejs }}', '{% url 'accounts:mcp_client_revoke' client.pk %}')"
          class="shrink-0 h-8 px-3 text-[13px] font-semibold text-rose-500 dark:text-rose-400 border border-rose-500/20 rounded-lg hover:bg-rose-500/10 transition-colors"
        >
          Revoke
        </button>
      </li>
    {% endfor %}
  </ul>
{% else %}
  <p class="text-[12px] text-slate-400">
    No client holds access to your tasks.
  </p>
{% endif %}
