{% extends 'common/_main.html' %}
{% load static %}

{% block content %}
<main class="h-svh flex flex-col items-center relative">
  <div class="w-full max-w-2xl px-6 pt-8 flex-1 flex flex-col min-h-0">
    <div class="flex items-start justify-between mb-8">
      <div>
        <h1 class="text-xl font-extrabold tracking-tight text-stone-900 dark:text-white">
          wup<span class="text-ember-500">next</span>
        </h1>
        <p id="queue-stats" class="text-[13px] text-stone-500 mt-1">
          {% include 'tasks/partials/tasks_summary.html' %}
        </p>
      </div>
      <form
        method="POST"
        action="{% url 'accounts:logout' %}"
        aria-label="Logout"
      >
        {% csrf_token %}
        <button type="submit" class="mt-1 text-stone-400 hover:text-rose-500 dark:hover:text-rose-400 transition-colors grid place-items-center">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
          </svg>
        </button>
      </form>
    </div>

    <div id="queue-content" class="flex-1 flex flex-col gap-6 min-h-0">
      {% include 'tasks/partials/task_list.html' %}
    </div>
  </div>

  <div class="shrink-0 w-full mt-4 border-t border-stone-200 dark:border-stone-800/60">
    <div class="max-w-2xl mx-auto px-6">
      <form
        hx-post="{% url 'tasks:task' %}"
        hx-target="#queue-content"
        hx-swap="innerHTML"
        hx-on::after-request="this.reset()"
        class="flex items-center gap-3 w-full h-16"
      >
        <span class="text-ember-500 text-xl font-light leading-none">+</span>
        <input
          type="text"
          name="name"
          placeholder="Add a task..."
          required
          class="flex-1 bg-transparent text-[15px] text-stone-900 dark:text-white placeholder-stone-400 dark:placeholder-stone-600 outline-none border-none ring-0 shadow-none focus:outline-none focus:ring-0 focus:shadow-none"
        />
        <button
          type="submit"
          class="shrink-0 px-4 h-9 rounded-full bg-gradient-to-b from-ember-500 to-ember-600 text-white text-sm font-semibold shadow-lg shadow-ember-600/20 hover:from-ember-400 hover:to-ember-500 transition-all"
        >
          Add
        </button>
      </form>
    </div>
  </div>
</main>
{% endblock %}
