<div class="flex items-center gap-3 py-3">
  <div class="w-6 h-6 rounded-full bg-teal-500/15 dark:bg-teal-500/20 border-2 border-teal-500/40 flex items-center justify-center shrink-0">
    <svg class="w-3 h-3 text-teal-600 dark:text-teal-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
    </svg>
  </div>
  <span class="flex-1 min-w-0 text-[15px] text-stone-400 dark:text-stone-500 line-through truncate">{{ task.name }}</span>
  {% include 'tasks/partials/weight_badge.html' with weight=task.weight muted=True %}
  <span class="shrink-0 text-xs text-stone-400 dark:text-stone-600">{{ task.completed_at|date:"M j" }}</span>
  <button
    type="button"
    hx-delete="{% url 'tasks:task-detail' task.id %}"
    hx-target="#queue-content"
    hx-swap="innerHTML"
    class="shrink-0 text-stone-300 dark:text-stone-600 hover:text-rose-500 dark:hover:text-rose-400 transition-colors"
    aria-label="Delete task"
  >
    <svg class="size-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M10 11v6" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M14 11v6" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 7l1 14h10l1-14" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 7V4h6v3" />
    </svg>
  </button>
</div>
