<div
  x-data="{ delOpen: false, delTitle: '', delName: '', delDesc: '', delUrl: '' }"
  @confirm-delete.window="delOpen = true; delTitle = $event.detail.title; delName = $event.detail.name; delDesc = $event.detail.desc; delUrl = $event.detail.url"
  @keydown.escape.window="delOpen = false"
>
  <div
    x-show="delOpen"
    x-cloak
    @click="delOpen = false"
    x-transition.opacity
    class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40"
  ></div>

  <div
    x-show="delOpen"
    x-cloak
    x-transition
    class="fixed inset-0 z-50 flex items-center justify-center p-4 pointer-events-none"
  >
    <div
      @click.stop
      class="w-full max-w-sm bg-white dark:bg-slate-900 rounded-2xl border border-slate-200 dark:border-slate-800 shadow-2xl pointer-events-auto p-6"
    >
      <div class="flex items-start gap-4">
        <div class="shrink-0 w-11 h-11 rounded-full bg-rose-500/10 flex items-center justify-center">
          {% include 'common/icons/trash.html' with class='w-5 h-5 text-rose-500 dark:text-rose-400' stroke='1.8' %}
        </div>
        <div class="min-w-0">
          <h2 class="text-lg font-bold text-slate-900 dark:text-white" x-text="delTitle"></h2>
          <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
            Delete <span class="font-semibold text-slate-700 dark:text-slate-200">“<span x-text="delName"></span>”</span>? <span x-text="delDesc"></span>
          </p>
        </div>
      </div>

      <div class="mt-6 flex gap-3">
        <button
          type="button"
          @click="delOpen = false"
          class="flex-1 h-11 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-semibold hover:bg-slate-50 dark:hover:bg-slate-800/60 transition-colors"
        >
          Cancel
        </button>
        <button
          type="button"
          @click="htmx.ajax('DELETE', delUrl, { target: '#queue-content', swap: 'innerHTML', source: $el }); delOpen = false"
          class="flex-1 h-11 rounded-xl bg-rose-500 hover:bg-rose-600 text-white font-semibold shadow-lg shadow-rose-600/20 transition-colors"
        >
          Delete
        </button>
      </div>
    </div>
  </div>
</div>
