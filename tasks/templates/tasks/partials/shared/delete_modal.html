{% load ui %}
<div
  x-data="{ delOpen: false, delTitle: '', delName: '', delDesc: '', delUrl: '', delTarget: '#queue-content' }"
  @confirm-delete.window="delOpen = true; delTitle = $event.detail.title; delName = $event.detail.name; delDesc = $event.detail.desc; delUrl = $event.detail.url; delTarget = $event.detail.target || '#queue-content'"
  @keydown.escape.window="delOpen = false"
>
  {% modal openStateKey="delOpen" %}
    <div class="p-6">
      <div class="flex items-start gap-4">
        <div class="shrink-0 w-11 h-11 rounded-full bg-rose-500/10 flex items-center justify-center">
          {% include 'common/icons/trash.html' with class='w-5 h-5 text-rose-500 dark:text-rose-400' stroke='1.8' %}
        </div>
        <div class="min-w-0">
          <h2 class="text-lg font-bold text-slate-900 dark:text-white" x-text="delTitle"></h2>
          <p class="mt-1 text-sm text-slate-500 dark:text-slate-400">
            Delete <span class="font-semibold text-slate-700 dark:text-slate-200">“<span x-text="delName"></span>”</span>? <span x-text="delDesc"></span>
          </p>
        </div>
      </div>

      <div class="mt-6 flex gap-3">
        <button
          type="button"
          @click="delOpen = false"
          class="flex-1 h-11 rounded-xl border border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 font-semibold hover:bg-slate-50 dark:hover:bg-slate-800/60 transition-colors"
        >
          Cancel
        </button>
        <button
          type="button"
          @click="htmx.ajax('DELETE', delUrl, { target: delTarget, swap: 'innerHTML', source: $el }); delOpen = false"
          class="flex-1 h-11 rounded-xl bg-rose-500 hover:bg-rose-600 text-white font-semibold shadow-lg shadow-rose-600/20 transition-colors"
        >
          Delete
        </button>
      </div>
    </div>
  {% endmodal %}
</div>
