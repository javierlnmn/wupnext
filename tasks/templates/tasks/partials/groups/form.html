{% load ui %}
<div
  x-data="groupForm()"
  @open-group.window="openGroup($event.detail)"
  @group-saved="groupOpen = false"
  @keydown.escape.window="groupOpen = false"
>
  {% drawer openStateKey="groupOpen" %}
    <div class="flex items-center justify-between px-6 py-5 border-b border-slate-200 dark:border-slate-800">
      <h2 class="text-lg font-bold text-slate-900 dark:text-white" x-text="gId ? 'Edit group' : 'New group'"></h2>
      <button
        type="button"
        @click="groupOpen = false"
        class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors"
        aria-label="Close"
      >
        {% include 'common/icons/close.html' with class='w-5 h-5' %}
      </button>
    </div>

    <form
      hx-post="{% url 'tasks:group-create' %}{{ board_query }}"
      hx-target="#queue-content"
      hx-swap="innerHTML"
      hx-on::after-request="groupFormComplete(event)"
      class="flex-1 flex flex-col px-6 py-6 gap-6 overflow-y-auto"
    >
      <input type="hidden" name="group_id" :value="gId">
      <div>
        <label for="group-name" class="block text-[13px] text-slate-500 dark:text-slate-400 mb-1.5">Name</label>
        <input
          required
          type="text"
          name="name"
          id="group-name"
          x-model="gName"
          placeholder="Work, Personal, Errands…"
          class="w-full h-11 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl px-4 text-[15px] text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-600 outline-none focus:border-clay-500/50 focus:ring-1 focus:ring-clay-500/30 transition-all"
        />
      </div>

      <div>
        <label class="block text-[13px] text-slate-500 dark:text-slate-400 mb-2">Color</label>
        <div class="flex flex-wrap gap-2.5">
          {% for color in task_group_palette %}
          <button
            type="button"
            @click="gColor = '{{ color.hex }}'"
            class="w-7 h-7 rounded-full transition-transform hover:scale-110"
            :class="gColor === '{{ color.hex }}' ? 'ring-2 ring-offset-2 ring-offset-white dark:ring-offset-slate-900 ring-slate-400 dark:ring-slate-500' : ''"
            style="background-color: {{ color.hex }}"
            aria-label="{{ color.name }}"
          ></button>
          {% endfor %}
        </div>
        <input type="hidden" name="color" :value="gColor">
      </div>

      <div class="flex-1"></div>

      <button
        type="submit"
        class="w-full h-11 bg-clay-500 hover:bg-clay-600 text-white font-semibold rounded-xl transition-all"
        x-text="gId ? 'Save changes' : 'Create group'"
      ></button>
    </form>
  {% enddrawer %}
</div>

<script>
  document.addEventListener('alpine:init', () => {
    Alpine.data('groupForm', () => ({
      groupOpen: false,
      gId: null,
      gName: '',
      gColor: '{{ default_task_group_color }}',
      openGroup(detail) {
        this.gId = detail.id ?? null
        this.gName = detail.name ?? ''
        this.gColor = detail.color ?? '{{ default_task_group_color }}'
        this.groupOpen = true
      },
    }))
  })

  function openNewGroupForm() {
    window.dispatchEvent(new CustomEvent('open-group', { detail: {} }))
  }

  function openEditGroupForm(id, name, color) {
    window.dispatchEvent(new CustomEvent('open-group', { detail: { id, name, color } }))
  }

  function groupFormComplete(event) {
    if (event.detail.successful) {
      event.target.reset()
      event.target.dispatchEvent(new CustomEvent('group-saved', { bubbles: true }))
    }
  }
</script>
