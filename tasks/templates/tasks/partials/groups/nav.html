<button
  hx-post="{% url 'tasks:group-filter' %}"
  hx-vals='{"group": "all"}'
  hx-target="#queue-content"
  hx-swap="innerHTML"
  class="shrink-0 lg:w-full flex items-center gap-2 rounded-xl px-3 py-2 text-sm font-medium whitespace-nowrap transition-colors {% if not active_group %}bg-clay-100/70 dark:bg-clay-500/15 text-clay-700 dark:text-clay-300{% else %}text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/60{% endif %}"
>
  <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
    <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h10" />
  </svg>
  <span class="flex-1 text-left">All tasks</span>
  <span class="text-xs tabular-nums {% if not active_group %}text-clay-600 dark:text-clay-400{% else %}text-slate-400 dark:text-slate-500{% endif %}">{{ group_all_count }}</span>
</button>

{% for group in groups %}
<div class="relative shrink-0 lg:w-full group/nav">
  <button
    hx-post="{% url 'tasks:group-filter' %}"
    hx-vals='{"group": "{{ group.id }}"}'
    hx-target="#queue-content"
    hx-swap="innerHTML"
    class="w-full flex items-center gap-2 rounded-xl px-3 py-2 text-sm font-medium whitespace-nowrap transition-colors {% if active_group and active_group.id == group.id %}{% else %}text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/60{% endif %}"
    {% if active_group and active_group.id == group.id %}style="background-color: {{ group.color }}1a; color: {{ group.color }};"{% endif %}
  >
    <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: {{ group.color }}"></span>
    <span class="flex-1 text-left truncate">{{ group.name }}</span>
    <span class="text-xs tabular-nums transition-opacity lg:group-hover/nav:opacity-0 {% if active_group and active_group.id == group.id %}{% else %}text-slate-400 dark:text-slate-500{% endif %}">{{ group.pending_count }}</span>
  </button>
  <button
    type="button"
    onclick="window.dispatchEvent(new CustomEvent('confirm-delete', { detail: { title: 'Delete group', name: '{{ group.name|escapejs }}', desc: 'Its tasks are kept and moved to No group.', url: '{% url 'tasks:group-detail' group.id %}' } }))"
    class="absolute right-1.5 top-1/2 -translate-y-1/2 p-1 rounded-md text-slate-400 hover:text-rose-500 dark:hover:text-rose-400 opacity-0 lg:group-hover/nav:opacity-100 transition-opacity"
    aria-label="Delete group"
  >
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M10 11v6" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M14 11v6" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 7l1 14h10l1-14" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 7V4h6v3" />
    </svg>
  </button>
</div>
{% endfor %}

<button
  type="button"
  onclick="window.dispatchEvent(new CustomEvent('new-group'))"
  class="shrink-0 lg:w-full flex items-center gap-2 rounded-xl px-3 py-2 text-sm font-medium whitespace-nowrap border border-dashed border-slate-300 dark:border-slate-700 text-slate-400 dark:text-slate-500 hover:text-clay-600 dark:hover:text-clay-400 hover:border-clay-400 dark:hover:border-clay-600 transition-colors"
>
  <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8">
    <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
  </svg>
  <span>New group</span>
</button>
