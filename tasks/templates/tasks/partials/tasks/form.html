{% load ui %}
<div
  x-data="taskForm()"
  @keydown.escape.window="open = false"
  @task-saved="open = false; reset()"
  @open-task.window="openTask($event.detail)"
  @open-subtask.window="openSubtask($event.detail)"
>
  <button
    type="button"
    @click="openNewTaskForm({% if active_task_group %}{{ active_task_group.id }}{% else %}null{% endif %})"
    class="fixed bottom-6 right-6 z-30 w-14 h-14 rounded-full bg-clay-500 hover:bg-clay-600 text-white transition-all flex items-center justify-center"
    aria-label="Add task"
  >
    {% include 'common/icons/plus.html' with class='w-6 h-6' stroke='2.5' %}
  </button>

  {% drawer openStateKey="open" %}
    <div class="flex items-center justify-between px-6 py-5 border-b border-slate-200 dark:border-slate-800">
      <h2 class="text-lg font-bold text-slate-900 dark:text-white" x-text="parentId ? (taskId ? 'Edit subtask' : 'New subtask') : (taskId ? 'Edit task' : 'New task')"></h2>
      <button
        type="button"
        @click="open = false"
        class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors"
        aria-label="Close"
      >
        {% include 'common/icons/close.html' with class='w-5 h-5' %}
      </button>
    </div>

    <form
      hx-post="{% url 'tasks:task' %}{{ board_query }}"
      hx-target="#queue-content"
      hx-swap="innerHTML"
      hx-on::after-request="taskFormComplete(event)"
      class="flex-1 flex flex-col px-6 py-6 gap-6 overflow-y-auto"
    >
      <input type="hidden" name="task_id" :value="taskId">
      <input type="hidden" name="parent_id" :value="parentId">
      <input type="hidden" name="group_id" :value="groupId">

      <div>
        <label for="task-name" class="block text-[13px] text-slate-500 dark:text-slate-400 mb-1.5">Name</label>
        <input
          required
          type="text"
          name="name"
          id="task-name"
          x-model="name"
          placeholder="What do you need to do?"
          class="w-full h-11 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl px-4 text-[15px] text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-600 outline-none focus:border-clay-500/50 focus:ring-1 focus:ring-clay-500/30 transition-all"
        />
      </div>

      <div x-show="!parentId">
        <label class="block text-[13px] text-slate-500 dark:text-slate-400 mb-2">Group</label>
        <div id="drawer-groups" class="flex flex-wrap gap-2">
          {% include 'tasks/partials/groups/picker.html' %}
        </div>
      </div>

      <div x-show="!parentId">
        <label for="task-due" class="block text-[13px] text-slate-500 dark:text-slate-400 mb-1.5">Due date</label>
        <input
          type="date"
          name="due_date"
          id="task-due"
          x-model="dueDate"
          class="w-full h-11 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl px-4 text-[15px] text-slate-900 dark:text-white outline-none focus:border-clay-500/50 focus:ring-1 focus:ring-clay-500/30 transition-all"
        />
      </div>

      <div x-show="!parentId">
        <label class="block text-[13px] text-slate-500 dark:text-slate-400 mb-2">Weight</label>
        <div class="flex items-center gap-1.5" @mouseleave="hover = 0">
          <template x-for="i in {{ max_task_weight }}" :key="i">
            <button
              type="button"
              @click="weight = (weight === i ? 0 : i)"
              @mouseenter="hover = i"
              class="p-1 transition-all hover:scale-110"
              :class="(hover || weight) >= i ? 'text-amber-500' : 'text-slate-300 dark:text-slate-700'"
              :aria-label="'Set weight to ' + i"
            >
              {% include 'common/icons/flame.html' with class='w-6 h-6' %}
            </button>
          </template>
        </div>
        <input type="hidden" name="weight" :value="weight">
      </div>

      <div class="flex-1"></div>

      <button
        type="submit"
        class="w-full h-11 bg-clay-500 hover:bg-clay-600 text-white font-semibold rounded-xl transition-all"
        x-text="taskId ? 'Save changes' : (parentId ? 'Add subtask' : 'Add task')"
      ></button>
    </form>
  {% enddrawer %}
</div>

<script>
  document.addEventListener('alpine:init', () => {
    Alpine.data('taskForm', () => ({
      open: false,
      taskId: null,
      parentId: null,
      groupId: null,
      name: '',
      weight: 0,
      dueDate: '',
      hover: 0,
      reset() {
        this.taskId = null
        this.parentId = null
        this.groupId = null
        this.name = ''
        this.weight = 0
        this.dueDate = ''
        this.hover = 0
      },
      openTask(detail = {}) {
        this.reset()
        this.taskId = detail.id ?? null
        this.name = detail.name ?? ''
        this.weight = detail.weight ?? 0
        this.groupId = detail.groupId ?? null
        this.dueDate = detail.dueDate ?? ''
        this.open = true
      },
      openSubtask(detail) {
        this.reset()
        this.taskId = detail.id ?? null
        this.parentId = detail.parentId
        this.name = detail.name ?? ''
        this.open = true
      },
    }))
  })

  function openNewTaskForm(groupId) {
    window.dispatchEvent(new CustomEvent('open-task', { detail: { groupId } }))
  }

  function openEditTaskForm(id, name, weight, groupId, dueDate) {
    window.dispatchEvent(new CustomEvent('open-task', { detail: { id, name, weight, groupId, dueDate } }))
  }

  function openNewSubtaskForm(parentId) {
    window.dispatchEvent(new CustomEvent('open-subtask', { detail: { parentId } }))
  }

  function openEditSubtaskForm(id, name, parentId) {
    window.dispatchEvent(new CustomEvent('open-subtask', { detail: { id, name, parentId } }))
  }

  function taskFormComplete(event) {
    if (event.detail.successful) {
      event.target.dispatchEvent(new CustomEvent('task-saved', { bubbles: true }))
    }
  }
</script>
