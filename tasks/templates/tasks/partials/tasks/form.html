<div
  x-data="{
    open: false, taskId: null, parentId: null, groupId: null, name: '', weight: 0, hover: 0,
    reset() { this.taskId = null; this.parentId = null; this.groupId = null; this.name = ''; this.weight = 0; this.hover = 0 },
    openNew(groupId) { this.reset(); this.groupId = groupId; this.open = true },
    openSubtask(parentId) { this.reset(); this.parentId = parentId; this.open = true },
    openEdit(d) { this.reset(); this.taskId = d.id; this.name = d.name; this.weight = d.weight; this.groupId = d.group; this.open = true },
  }"
  @keydown.escape.window="open = false"
  @task-added="open = false; reset()"
  @edit-task.window="openEdit($event.detail)"
  @add-subtask.window="openSubtask($event.detail.parentId)"
>
  <button
    type="button"
    @click="openNew({% if active_group %}{{ active_group.id }}{% else %}null{% endif %})"
    class="fixed bottom-6 right-6 z-30 w-14 h-14 rounded-full bg-clay-500 hover:bg-clay-600 text-white shadow-lg shadow-clay-600/30 transition-all flex items-center justify-center"
    aria-label="Add task"
  >
    {% include 'common/icons/plus.html' with class='w-6 h-6' stroke='2.5' %}
  </button>

  <div
    x-show="open"
    x-cloak
    @click="open = false"
    x-transition.opacity
    class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm z-40"
  ></div>

  <div
    x-show="open"
    x-cloak
    x-transition:enter="transition ease-out duration-300"
    x-transition:enter-start="translate-x-full"
    x-transition:enter-end="translate-x-0"
    x-transition:leave="transition ease-in duration-200"
    x-transition:leave-start="translate-x-0"
    x-transition:leave-end="translate-x-full"
    class="fixed top-0 right-0 h-full w-full max-w-sm bg-white dark:bg-slate-900 border-l border-slate-200 dark:border-slate-800 shadow-2xl z-50 flex flex-col"
  >
    <div class="flex items-center justify-between px-6 py-5 border-b border-slate-200 dark:border-slate-800">
      <h2 class="text-lg font-bold text-slate-900 dark:text-white" x-text="taskId ? 'Edit task' : (parentId ? 'New subtask' : 'New task')"></h2>
      <button
        type="button"
        @click="open = false"
        class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors"
        aria-label="Close"
      >
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <form
      hx-post="{% url 'tasks:task' %}"
      hx-target="#queue-content"
      hx-swap="innerHTML"
      hx-on::after-request="if(event.detail.successful){ this.dispatchEvent(new CustomEvent('task-added', { bubbles: true })) }"
      class="flex-1 flex flex-col px-6 py-6 gap-6 overflow-y-auto"
    >
      <input type="hidden" name="task_id" :value="taskId">
      <input type="hidden" name="parent_id" :value="parentId">
      <input type="hidden" name="group_id" :value="groupId">

      <div>
        <label for="task-name" class="block text-[13px] text-slate-500 dark:text-slate-400 mb-1.5">Name</label>
        <input
          required
          type="text"
          name="name"
          id="task-name"
          x-model="name"
          placeholder="What do you need to do?"
          class="w-full h-11 bg-slate-50 dark:bg-slate-800/60 border border-slate-200 dark:border-slate-700 rounded-xl px-4 text-[15px] text-slate-900 dark:text-white placeholder-slate-400 dark:placeholder-slate-600 outline-none focus:border-clay-500/50 focus:ring-1 focus:ring-clay-500/30 transition-all"
        />
      </div>

      <div x-show="!parentId">
        <label class="block text-[13px] text-slate-500 dark:text-slate-400 mb-2">Group</label>
        <div id="drawer-groups" class="flex flex-wrap gap-2">
          {% include 'tasks/partials/groups/picker.html' %}
        </div>
      </div>

      <div x-show="!parentId">
        <label class="block text-[13px] text-slate-500 dark:text-slate-400 mb-2">Weight</label>
        <div class="flex items-center gap-1.5" @mouseleave="hover = 0">
          <template x-for="i in {{ max_task_weight }}" :key="i">
            <button
              type="button"
              @click="weight = (weight === i ? 0 : i)"
              @mouseenter="hover = i"
              class="p-1 transition-transform hover:scale-110"
              :aria-label="'Set weight to ' + i"
            >
              <svg
                class="w-6 h-6 transition-colors"
                :class="(hover || weight) >= i ? 'text-amber-500' : 'text-slate-300 dark:text-slate-700'"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="2"
              >
                <path stroke-linecap="round" stroke-linejoin="round" d="M8.5 14.5a2.5 2.5 0 002.5-2.5c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 11-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 002.5 2.5z"/>
              </svg>
            </button>
          </template>
        </div>
        <input type="hidden" name="weight" :value="weight">
      </div>

      <div class="flex-1"></div>

      <button
        type="submit"
        class="w-full h-11 bg-clay-500 hover:bg-clay-600 text-white font-semibold rounded-xl shadow-lg shadow-clay-600/20 transition-all"
        x-text="taskId ? 'Save changes' : (parentId ? 'Add subtask' : 'Add task')"
      ></button>
    </form>
  </div>
</div>
