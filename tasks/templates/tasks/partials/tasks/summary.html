{% if pending_tasks %}
  <span class="text-clay-600 dark:text-clay-400 font-semibold">{{ pending_tasks|length }}</span> task{{ pending_tasks|length|pluralize }} remaining.
{% elif completed_tasks %}
  <span class="text-emerald-600 dark:text-emerald-400 font-semibold">All tasks completed!</span>
{% else %}
  No tasks queued.
{% endif %}
