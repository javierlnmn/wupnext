<button
  type="button"
  onclick="window.dispatchEvent(new CustomEvent('confirm-delete', { detail: { title: '{% if task.parent_id %}Delete subtask{% else %}Delete task{% endif %}', name: '{{ task.name|escapejs }}', desc: '{% if task.parent_id %}This subtask will be permanently deleted.{% elif task.subtask_count %}This task and its {{ task.subtask_count }} subtask{{ task.subtask_count|pluralize }} will be permanently deleted.{% else %}This task will be permanently deleted.{% endif %}', url: '{% url 'tasks:task-detail' task.id %}{{ group_query }}' } }))"
  class="shrink-0 text-slate-300 dark:text-slate-600 hover:text-rose-500 dark:hover:text-rose-400 transition-colors"
  aria-label="{% if task.parent_id %}Delete subtask{% else %}Delete task{% endif %}"
>
  {% include 'common/icons/trash.html' with class=size|default:'w-5 h-5' %}
</button>
