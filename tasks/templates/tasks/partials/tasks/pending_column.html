<div id="pending-scroll" data-preserve-scroll class="min-h-0 overflow-y-auto rounded-2xl bg-clay-50/70 dark:bg-clay-900/20 border border-clay-200/70 dark:border-clay-800/40 shadow-lg shadow-clay-900/5 dark:shadow-black/20 px-5 pt-4 pb-3">
  <h2 class="flex items-center gap-1.5 text-[11px] font-semibold tracking-[0.15em] text-clay-700 dark:text-clay-400 uppercase mb-3">
    <span class="w-1.5 h-1.5 rounded-full bg-olive-500"></span>
    Pending &middot; {{ pending_tasks|length }}
  </h2>
  {% if pending_tasks %}
  <div class="flex flex-col gap-2"{% if reorderable %} data-sortable="{% url 'tasks:task-reorder' %}{{ board_query }}"{% endif %}>
    {% for task in pending_tasks %}
      {% include 'tasks/partials/tasks/pending_item.html' %}
    {% endfor %}
  </div>
  {% endif %}
</div>
