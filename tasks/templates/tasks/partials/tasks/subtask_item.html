<div class="flex items-center gap-2.5 py-1.5">
  {% if task.completed_at %}
  <div class="w-4 h-4 rounded-full bg-emerald-500/15 dark:bg-emerald-500/20 border-2 border-emerald-500/40 flex items-center justify-center shrink-0">
    {% include 'common/icons/check.html' with class='w-2 h-2 text-emerald-600 dark:text-emerald-400' %}
  </div>
  <span class="flex-1 min-w-0 text-[13px] text-slate-400 dark:text-slate-600 line-through lg:truncate">{{ task.name }}</span>
  {% else %}
  <form
    class="flex shrink-0"
    hx-post="{% url 'tasks:task-complete' task.id %}{{ group_query }}"
    hx-target="#queue-content"
    hx-swap="innerHTML"
  >
    <button
      type="submit"
      class="w-4 h-4 rounded-full border-2 border-clay-300 dark:border-clay-700 hover:border-clay-500 dark:hover:border-clay-500 hover:bg-clay-50 dark:hover:bg-clay-500/10 transition-colors shrink-0"
      aria-label="Mark subtask complete"
    ></button>
  </form>
  <span class="flex-1 min-w-0 text-[13px] text-slate-600 dark:text-slate-300 lg:truncate">{{ task.name }}</span>
  {% endif %}
  {% include 'tasks/partials/tasks/delete_task_button.html' with size='w-4 h-4' %}
</div>
