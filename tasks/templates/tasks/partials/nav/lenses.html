<a
  href="{% url 'tasks:board' %}?due={{ DueLens.TODAY }}"
  hx-boost="true"
  class="shrink-0 lg:w-full flex items-center gap-2 rounded-xl px-3 py-2 text-sm font-medium whitespace-nowrap transition-colors {% if active_due == DueLens.TODAY %}bg-clay-100/70 dark:bg-clay-500/15 text-clay-700 dark:text-clay-300{% else %}text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/60{% endif %}"
>
  {% include 'common/icons/calendar.html' with class='w-4 h-4 shrink-0' %}
  <span class="flex-1 text-left">Today</span>
  <span class="text-xs tabular-nums {% if active_due == DueLens.TODAY %}text-clay-600 dark:text-clay-400{% else %}text-slate-400 dark:text-slate-500{% endif %}">{{ today_count }}</span>
</a>

{% if overdue_count or active_due == DueLens.OVERDUE %}
<a
  href="{% url 'tasks:board' %}?due={{ DueLens.OVERDUE }}"
  hx-boost="true"
  class="shrink-0 lg:w-full flex items-center gap-2 rounded-xl px-3 py-2 text-sm font-medium whitespace-nowrap transition-colors {% if active_due == DueLens.OVERDUE %}bg-rose-100/70 dark:bg-rose-500/15 text-rose-700 dark:text-rose-300{% else %}text-rose-600 dark:text-rose-400 hover:bg-rose-50 dark:hover:bg-rose-500/10{% endif %}"
>
  {% include 'common/icons/alert.html' with class='w-4 h-4 shrink-0' %}
  <span class="flex-1 text-left">Overdue</span>
  <span class="text-xs tabular-nums {% if active_due == DueLens.OVERDUE %}text-rose-600 dark:text-rose-400{% else %}text-rose-500 dark:text-rose-500{% endif %}">{{ overdue_count }}</span>
</a>
{% endif %}
