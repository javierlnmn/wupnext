{% for group in task_groups %}
<div class="relative shrink-0 lg:w-full group/nav">
  <a
    href="{% url 'tasks:board' %}?group={{ group.id }}"
    hx-boost="true"
    class="w-full flex items-center gap-2 rounded-xl px-3 py-2 text-sm font-medium whitespace-nowrap transition-colors {% if active_task_group.id == group.id %}{% else %}text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800/60{% endif %}"
    {% if active_task_group.id == group.id %}style="background-color: {{ group.color }}1a; color: {{ group.color }};"{% endif %}
  >
    <span class="w-2.5 h-2.5 rounded-full shrink-0" style="background-color: {{ group.color }}"></span>
    <span class="flex-1 text-left truncate">{{ group.name }}</span>
    <span class="text-xs tabular-nums transition-opacity lg:group-hover/nav:opacity-0 {% if active_task_group.id == group.id %}{% else %}text-slate-400 dark:text-slate-500{% endif %}">{{ group.pending_count }}</span>
  </a>
  <button
    type="button"
    onclick="window.dispatchEvent(new CustomEvent('confirm-delete', { detail: { title: 'Delete group', name: '{{ group.name|escapejs }}', desc: 'Its tasks are kept and moved to No group.', url: '{% url 'tasks:group-detail' group.id %}{{ group_query }}' } }))"
    class="absolute right-1.5 top-1/2 -translate-y-1/2 p-1 rounded-md text-slate-400 hover:text-rose-500 dark:hover:text-rose-400 opacity-0 lg:group-hover/nav:opacity-100 transition-opacity"
    aria-label="Delete group"
  >
    {% include 'common/icons/trash.html' with class='w-4 h-4' %}
  </button>
</div>
{% endfor %}

<button
  type="button"
  onclick="window.dispatchEvent(new CustomEvent('new-group'))"
  class="shrink-0 lg:w-full flex items-center gap-2 rounded-xl px-3 py-2 text-sm font-medium whitespace-nowrap border border-dashed border-slate-300 dark:border-slate-700 text-slate-400 dark:text-slate-500 hover:text-clay-600 dark:hover:text-clay-400 hover:border-clay-400 dark:hover:border-clay-600 transition-colors"
>
  {% include 'common/icons/plus.html' with class='w-4 h-4 shrink-0' stroke='1.8' %}
  <span>New group</span>
</button>
