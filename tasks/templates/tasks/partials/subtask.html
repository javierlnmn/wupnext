<div class="flex items-center gap-2.5 py-1.5">
  {% if task.completed_at %}
  <div class="w-4 h-4 rounded-full bg-emerald-500/15 dark:bg-emerald-500/20 border-2 border-emerald-500/40 flex items-center justify-center shrink-0">
    <svg class="w-2 h-2 text-emerald-600 dark:text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="3">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
    </svg>
  </div>
  <span class="flex-1 min-w-0 text-[13px] text-slate-400 dark:text-slate-600 line-through truncate">{{ task.name }}</span>
  {% else %}
  <form
    class="flex shrink-0"
    hx-post="{% url 'tasks:task-complete' task.id %}"
    hx-target="#queue-content"
    hx-swap="innerHTML"
  >
    <button
      type="submit"
      class="w-4 h-4 rounded-full border-2 border-clay-300 dark:border-clay-700 hover:border-clay-500 dark:hover:border-clay-500 hover:bg-clay-50 dark:hover:bg-clay-500/10 transition-colors shrink-0"
      aria-label="Mark subtask complete"
    ></button>
  </form>
  <span class="flex-1 min-w-0 text-[13px] text-slate-600 dark:text-slate-300 truncate">{{ task.name }}</span>
  {% endif %}
  <button
    type="button"
    hx-delete="{% url 'tasks:task-detail' task.id %}"
    hx-target="#queue-content"
    hx-swap="innerHTML"
    class="shrink-0 text-slate-300 dark:text-slate-700 hover:text-rose-500 dark:hover:text-rose-400 transition-colors"
    aria-label="Delete subtask"
  >
    <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M10 11v6" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M14 11v6" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 7l1 14h10l1-14" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 7V4h6v3" />
    </svg>
  </button>
</div>
