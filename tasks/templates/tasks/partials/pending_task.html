<div class="flex items-center gap-3 py-3">
  <form
    hx-post="{% url 'tasks:task-complete' task.id %}"
    hx-target="#queue-content"
    hx-swap="innerHTML"
  >
    <button
      type="submit"
      class="w-5 h-5 rounded-full border-2 border-clay-300 dark:border-clay-700 hover:border-clay-500 dark:hover:border-clay-500 hover:bg-clay-50 dark:hover:bg-clay-500/10 transition-colors shrink-0"
      aria-label="Mark task complete"
    ></button>
  </form>
  <span class="flex-1 min-w-0 text-[15px] text-slate-800 dark:text-slate-200 truncate">{{ task.name }}</span>
  {% include 'tasks/partials/weight_badge.html' with weight=task.weight %}
  <button
    type="button"
    @click="$dispatch('edit-task', { id: {{ task.id }}, name: '{{ task.name|escapejs }}', weight: {{ task.weight }} })"
    class="shrink-0 text-slate-300 dark:text-slate-600 hover:text-clay-500 dark:hover:text-clay-400 transition-colors"
    aria-label="Edit task"
  >
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L6.832 19.82a4.5 4.5 0 01-1.897 1.13l-2.685.8.8-2.685a4.5 4.5 0 011.13-1.897L16.863 4.487z" />
    </svg>
  </button>
  <button
    type="button"
    hx-delete="{% url 'tasks:task-detail' task.id %}"
    hx-target="#queue-content"
    hx-swap="innerHTML"
    class="shrink-0 text-slate-300 dark:text-slate-600 hover:text-rose-500 dark:hover:text-rose-400 transition-colors"
    aria-label="Delete task"
  >
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
      <path stroke-linecap="round" stroke-linejoin="round" d="M4 7h16" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M10 11v6" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M14 11v6" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M6 7l1 14h10l1-14" />
      <path stroke-linecap="round" stroke-linejoin="round" d="M9 7V4h6v3" />
    </svg>
  </button>
</div>
