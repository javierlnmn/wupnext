{% if not archived_tasks %}

<div class="flex flex-col items-center justify-center flex-1 text-center">
  <p class="text-2xl font-semibold text-slate-400 dark:text-slate-600">Nothing archived.</p>
  <p class="text-sm text-slate-400 dark:text-slate-600 mt-2">Completed tasks you archive land here.</p>
</div>

{% else %}

<div class="flex flex-col gap-2">
  {% for task in archived_tasks %}
    {% include 'tasks/partials/archive/item.html' %}
  {% endfor %}
</div>

{% endif %}
