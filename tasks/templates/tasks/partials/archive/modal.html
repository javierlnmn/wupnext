{% load ui %}
<div
  x-data="{ archiveOpen: false }"
  @open-archive.window="archiveOpen = true"
  @keydown.escape.window="archiveOpen = false"
>
  {% modal openStateKey="archiveOpen" width="46rem" %}
    <div class="flex flex-col" style="height: 42rem; max-height: 90dvh">
      <div class="flex items-center justify-between px-6 py-5 border-b border-slate-200 dark:border-slate-800">
        <h2 class="text-lg font-bold text-slate-900 dark:text-white">Archive</h2>
        <button
          type="button"
          @click="archiveOpen = false"
          class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 transition-colors"
          aria-label="Close"
        >
          {% include 'common/icons/close.html' with class='w-5 h-5' %}
        </button>
      </div>
      <div
        id="archive-content"
        class="flex flex-col flex-1 overflow-y-auto px-6 py-5"
        hx-get="{% url 'tasks:archive' %}{{ group_query }}"
        hx-trigger="open-archive from:window"
        hx-swap="innerHTML"
      ></div>
    </div>
  {% endmodal %}
</div>
